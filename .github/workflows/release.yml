name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust_target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            rust_target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            rust_target: ""
            args: ""
          - platform: ubuntu-22.04
            rust_target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Configure macOS signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          append_env() {
            local name="$1"
            local value="$2"

            if [ -n "$value" ]; then
              {
                echo "${name}<<__${name}__"
                echo "$value"
                echo "__${name}__"
              } >> "$GITHUB_ENV"
            fi
          }

          append_env "APPLE_CERTIFICATE" "$APPLE_CERTIFICATE_SECRET"
          append_env "APPLE_CERTIFICATE_PASSWORD" "$APPLE_CERTIFICATE_PASSWORD_SECRET"
          append_env "APPLE_SIGNING_IDENTITY" "$APPLE_SIGNING_IDENTITY_SECRET"
          append_env "APPLE_ID" "$APPLE_ID_SECRET"
          append_env "APPLE_PASSWORD" "$APPLE_PASSWORD_SECRET"
          append_env "APPLE_TEAM_ID" "$APPLE_TEAM_ID_SECRET"

      - name: Configure Windows C++ flags
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CXXFLAGS=/std:c++17" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Chikku Parser ${{ github.ref_name }}
          generateReleaseNotes: true
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
